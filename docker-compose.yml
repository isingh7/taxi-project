# Local stack: Postgres + API + dashboard + React UI.
#   docker compose up --build
#   docker compose run --rm etl            # load synthetic data into Postgres
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: taxi, POSTGRES_USER: taxi, POSTGRES_PASSWORD: taxi }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "taxi"], interval: 5s, retries: 10 }

  api:
    build: .
    environment: &api-env
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: local-compose-secret
      DJANGO_ALLOWED_HOSTS: "localhost,api"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      POSTGRES_HOST: db
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  etl:
    build: .
    environment: *api-env
    command: sh -c "python manage.py migrate --noinput && python manage.py ingest_trips --all --rows 20000"
    depends_on: { db: { condition: service_healthy } }
    profiles: ["etl"]

  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    environment: { API_BASE_URL: "http://api:8000/api" }
    ports: ["8050:8050"]
    depends_on: [api]

  web:
    build:
      context: ./taxi_frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
        REACT_APP_DASHBOARD_URL: http://localhost:8050
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
