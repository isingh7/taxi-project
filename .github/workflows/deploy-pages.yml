# Publishes a server-less demo of the React app to GitHub Pages.
# The Python pipeline runs here first: it loads synthetic sample data and exports the
# API's responses as static JSON, which the app reads in demo mode.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Load sample data and export the API as static JSON
        run: |
          python manage.py migrate --noinput
          python manage.py ingest_trips --all --rows 20000
          python manage.py export_static_api --out taxi_frontend/public/demo-data

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: taxi_frontend/package-lock.json }
      - name: Build the React app in demo mode
        working-directory: taxi_frontend
        env:
          REACT_APP_DEMO_MODE: "true"
          REACT_APP_REPO_URL: https://github.com/${{ github.repository }}
          GENERATE_SOURCEMAP: "false"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with: { path: taxi_frontend/build }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
