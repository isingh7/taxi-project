name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: taxi, POSTGRES_USER: taxi, POSTGRES_PASSWORD: taxi }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U taxi" --health-interval 5s --health-retries 10
    strategy:
      matrix:
        database: [sqlite, postgres]   # the SQL reports must work on both
    env:
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && 'localhost' || '' }}
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: taxi_frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: taxi_frontend/package-lock.json }
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      # google-map-react ships without source maps; CI=true would turn that warning into an error
      - run: GENERATE_SOURCEMAP=false npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taxi-api .
      - run: docker build -f dashboard/Dockerfile -t taxi-dashboard .
      - run: docker build -t taxi-web taxi_frontend
