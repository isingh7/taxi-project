[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taxi_project.settings"
python_files = ["test_*.py"]
testpaths = ["taxi_api/tests", "dashboard/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["taxi_api", "dashboard"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["taxi_frontend", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
